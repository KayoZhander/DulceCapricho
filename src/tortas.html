<!DOCTYPE html>
<html lang="es">

<head>
	<meta charset="utf-8">
	<title>Dulce Capricho – Tortas</title>
	<link rel="stylesheet" href="/css/styles.css">
</head>

<body>
	<section class="cakes">
		<div class="section-head">
			<span>Nuestra vitrina</span>
			<h2>Tortas de la semana</h2>
		</div>
		<div class="grid" id="tortas"></div>
	</section>

	<section class="personalizar">
		<div class="section-head">
			<span>Hazlo a tu manera</span>
			<h2>Personaliza tu torta</h2>
		</div>

		<form id="form-personalizar" class="form-personalizar">
			<div class="campo">
				<label for="torta">Torta base</label>
				<select id="torta" name="torta" required>
					<option value="">Selecciona una torta</option>
					<option value="Torta de chocolate">Torta de chocolate</option>
					<option value="Torta de frutilla">Torta de frutilla</option>
					<option value="Torta de limon">Torta de limon</option>
					<option value="Torta de blueberry">Torta de blueberry</option>
				</select>
			</div>

			<div class="campo">
				<label for="tamano">Tamaño</label>
				<select id="tamano" name="tamano" required>
					<option value="">Selecciona un tamaño</option>
					<option value="Pequeña">Pequeña (6-8 personas)</option>
					<option value="Mediana">Mediana (10-14 personas)</option>
					<option value="Grande">Grande (16-20 personas)</option>
				</select>
			</div>

			<div class="campo">
				<label for="bizcocho">Tipo de bizcocho</label>
				<select id="bizcocho" name="bizcocho" required>
					<option value="">Selecciona un bizcocho</option>
					<option value="Chocolate">Chocolate</option>
					<option value="Vainilla">Vainilla</option>
					<option value="Red Velvet">Red Velvet</option>
					<option value="Zanahoria">Zanahoria</option>
				</select>
			</div>

			<fieldset class="campo campo-fieldset">
				<legend>Rellenos (elige uno o más)</legend>
				<div class="opciones-check">
					<label><input type="checkbox" name="relleno" value="Manjar"> Manjar</label>
					<label><input type="checkbox" name="relleno" value="Frutillas"> Frutillas</label>
					<label><input type="checkbox" name="relleno" value="Ganache"> Ganache</label>
					<label><input type="checkbox" name="relleno" value="Crema pastelera"> Crema pastelera</label>
				</div>
			</fieldset>

			<div class="campo">
				<label for="cobertura">Cobertura</label>
				<select id="cobertura" name="cobertura" required>
					<option value="">Selecciona una cobertura</option>
					<option value="Chantilly">Chantilly</option>
					<option value="Fondant">Fondant</option>
					<option value="Ganache">Ganache</option>
					<option value="Buttercream">Buttercream</option>
				</select>
			</div>

<div class="campo">
	<label for="dedicatoria">Dedicatoria (opcional)</label>
	<textarea id="dedicatoria" name="dedicatoria" rows="3" maxlength="120" placeholder="Ej: ¡Feliz cumpleaños Sofía!"></textarea>
</div>

			<button type="submit" class="btn">Solicitar cotización</button>
		</form>
	</section>

	<script type="module" src="/js/tortas.js"></script>
	<script type="module" src="/js/personalizar.js"></script>
	<script src="/js/headerYFooter.js"></script>
</body>

</html>
