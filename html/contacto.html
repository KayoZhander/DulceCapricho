<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Dulce Capricho – Contacto</title>
	<link rel="stylesheet" href="../css/styles.css">
</head>

<body>
	<header id="header"></header>
	<main class="Contacto">
		<h1>Contacto</h1>
		<p>¿Tienes alguna duda o sugerencia? Contactate con nosotros.</p>

		<div class="contacto-container">
			<form id ="form-contacto" class = "form-contacto">
				<div class="campo">
					<label for = "nombre">Nombre</label>
					<input type="text" id="nombre" name ="nombre" required>
				</div>

				<div class = "campo">
					<label for = "email">Correo electronico</label>
					<input type="email" id="email "name="email" required>
				</div>

				<div class = "campo">
					<label for = "telefono">Telefono</label>
					<input type="tel" id ="telefono" name = "telefono">
				</div>

				<div class ="campo">
					<label for = "mensaje">Mensaje</label>
					<textarea id = "mensaje" name ="mensaje" rows="5" required ></textarea>
				</div>

				<button type ="submit">Enviar mensaje</button>
			</form>

			<div class ="info-contacto">
				<h2>Otras formas de contacto</h2>
				<p><strong>Dirección:</strong> Calle Armando Casas 123, Viña del Mar</p>
				<p><strong>Télefono:</strong> +56 9 1234 5678</p>
				<p><strong>Correo:</strong> contacto@dulcecapricho.cl</p>
				<p><strong>Horario:</strong> Lunes a Sábado, 9:00 - 20:00</p>
			</div>
		</div>
	</main>

	<script src="../js/contacto.js"></script>
	<script src="../js/headerYFooter.js"></script>
</body>

</html>
