<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Dulce Capricho – Registrarse</title>
	<link rel="stylesheet" href="../css/styles.css">
	<link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <section class="login-section">
        <div class="login-card">
            <h2>Recuperar cuenta</h2>
			<p class="subtitle">Le enviaremos un código por el correo especificado, para verificar que eres el dueño de la cuenta.</p>

            <form id="login-form" action="#" method="post">
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>
                <button type="submit" class="login-btn">Enviar código</button>
            </form>

            <div class="login-links">
                <a href="#" id="login-links-olvide-correo">¿Olvidaste tu correo?</a>
                <a href="login.html">Volver</a>
            </div>
        </div>
    </section>

	<script src="../js/recuperar.js"></script>
	<script src="../js/headerYFooter.js"></script>
</body>

</html>
