<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Dulce Capricho – Iniciar sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- Login content (will be placed between the header and footer) -->
    <section class="login-section">
        <div class="login-card">
            <h2>Bienvenido de vuelta</h2>
            <p class="subtitle">Inicia sesión para ver tus pedidos y favoritos</p>

            <form id="login-form" action="#" method="post">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Al menos 8 characteres" required>
                </div>
                <button type="submit" class="login-btn">Iniciar sesión</button>
            </form>

            <div class="login-links">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <a href="#">Crear cuenta</a>
            </div>
        </div>
    </section>

    <script src="../js/login.js"></script>
    <script src="../js/headerYFooter.js"></script>
</body>

</html>
