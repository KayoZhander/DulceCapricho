<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>Dulce Capricho – Registrarse</title>
	<link rel="stylesheet" href="../css/styles.css">
	<link rel="stylesheet" href="../css/login.css">
</head>

<body>
	<section class="login-section">
        <div class="login-card">
            <h2>Crear cuenta</h2>
			<p class="subtitle">Registrate para guardar tus tortas favoritas</p>

            <form id="login-form" action="#" method="post">
                <div class="form-group">
                    <label for="text">Nombre(s)</label>
                    <input type="pnombre" id="pnombre" name="pnombre" placeholder="Primer nombre" required>
                    <input type="snombre" id="snombre" name="snombre" placeholder="Segundo nombre">
                </div>
                <div class="form-group">
                    <label for="text">Apellidos</label>
                    <input type="apaterno" id="apaterno" name="apaterno" placeholder="Apellido paterno" required>
                    <input type="amaterno" id="amaterno" name="amaterno" placeholder="Apellido materno" required>
                </div>
                <div class="form-group">
                    <label for="email">Correo</label>
                    <input type="email" id="email" name="email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Al menos 8 characteres" required>
                </div>
                <button type="submit" class="login-btn">Registrarse</button>
            </form>

            <div class="login-links">
                <a href="login.html">Ya tengo cuenta</a>
            </div>
        </div>
    </section>

	<script src="../js/registrar.js"></script>
	<script src="../js/headerYFooter.js"></script>
</body>

</html>
